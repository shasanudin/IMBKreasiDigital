<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampiran NIB - Edit & Print</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .document-container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px 35px 40px;
            border-radius: 4px;
            margin-bottom: 30px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .logo-area {
            flex-shrink: 0;
            width: 100px;
            text-align: center;
        }

        .logo-area img {
            width: 90px;
            height: auto;
            display: block;
        }

        .header-text {
            flex: 1;
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .header-text h2 {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .header-text .nib-number {
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
        }

        .header-text .nib-number span {
            font-weight: normal;
        }

        .lampiran-desc {
            font-size: 15px;
            margin: 15px 0 10px;
        }

        /* Tabel */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 8px;
            border: 1px solid #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 900px;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px 6px;
            vertical-align: top;
            text-align: left;
        }

        th {
            background: #d9d9d9;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
        }

        td {
            background: #fff;
        }

        .col-no {
            width: 40px;
            text-align: center;
        }

        .col-kbli {
            width: 80px;
            text-align: center;
        }

        .col-judul {
            width: 180px;
        }

        .col-lokasi {
            width: 200px;
        }

        .col-risiko {
            width: 80px;
            text-align: center;
        }

        .col-izin {
            width: 70px;
            text-align: center;
        }

        .col-status {
            width: 70px;
            text-align: center;
        }

        .col-keterangan {
            width: 100px;
        }

        .group-header {
            text-align: center;
            font-weight: bold;
            background: #d9d9d9;
        }

        /* Input styling */
        td input,
        td textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            padding: 2px 0;
            resize: vertical;
            outline: none;
        }

        td input:focus,
        td textarea:focus {
            background: #f0f8ff;
            box-shadow: 0 0 0 1px #4a90e2;
            border-radius: 2px;
        }

        td textarea {
            min-height: 40px;
            line-height: 1.3;
        }

        .td-center {
            text-align: center;
        }

        .td-center input {
            text-align: center;
        }

        /* Tombol aksi */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-add {
            background: #2e7d32;
            color: white;
        }
        .btn-add:hover {
            background: #1b5e20;
        }

        .btn-print {
            background: #0d47a1;
            color: white;
        }
        .btn-print:hover {
            background: #0a3a7a;
        }

        .btn-delete {
            background: #c62828;
            color: white;
        }
        .btn-delete:hover {
            background: #a31515;
        }

        .btn-delete-row {
            background: #e53935;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            width: 100%;
        }

        .btn-delete-row:hover {
            background: #b71c1c;
        }

        .footer-note {
            text-align: right;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            border-top: 1px dashed #aaa;
            padding-top: 12px;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: #fff;
                padding: 0;
                margin: 0;
            }

            .document-container {
                box-shadow: none;
                padding: 15px 20px;
                border-radius: 0;
                max-width: 100%;
                margin: 0;
            }

            .action-bar {
                display: none !important;
            }

            .btn-delete-row {
                display: none !important;
            }

            td input,
            td textarea {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                -webkit-appearance: none;
                appearance: none;
                color: #000;
                font-size: 12px;
            }

            td textarea {
                min-height: auto;
                resize: none;
                overflow: hidden;
            }

            table {
                font-size: 12px;
                min-width: 0;
                width: 100%;
            }

            th, td {
                padding: 4px 4px;
                border: 1px solid #000;
            }

            .header-text h1 {
                font-size: 15px;
            }
            .header-text h2 {
                font-size: 13px;
            }
            .header-text .nib-number {
                font-size: 13px;
            }

            .lampiran-desc {
                font-size: 12px;
            }

            .col-no { width: 30px; }
            .col-kbli { width: 55px; }
            .col-judul { width: 140px; }
            .col-lokasi { width: 160px; }
            .col-risiko { width: 60px; }
            .col-izin { width: 50px; }
            .col-status { width: 50px; }
            .col-keterangan { width: 80px; }

            .footer-note {
                font-size: 11px;
            }

            /* Sembunyikan kolom aksi di print */
            .col-action {
                display: none;
            }
            td.col-action {
                display: none;
            }
        }

        @media (max-width: 700px) {
            .document-container {
                padding: 18px 12px;
            }

            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
            }

            .header-text h1 {
                font-size: 15px;
            }
            .header-text h2 {
                font-size: 14px;
            }

            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="document-container" id="docContainer">
        <!-- HEADER -->
        <div class="header">
            <div class="logo-area">
                <!-- Logo Garuda (SVG inline sederhana, bisa diganti dengan gambar) -->
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f5c542' stroke='%23b8860b' stroke-width='2'/%3E%3Ctext x='50' y='62' font-size='36' text-anchor='middle' fill='%23000' font-weight='bold'%3EGaruda%3C/text%3E%3C/svg%3E" alt="Logo Garuda">
            </div>
            <div class="header-text">
                <h1>Pemerintah Republik Indonesia</h1>
                <h2>Perizinan Berusaha Berbasis Risiko</h2>
                <div class="nib-number">LAMPIRAN NOMOR INDUK BERUSAHA: <span contenteditable="true">2208230186272</span></div>
            </div>
        </div>

        <div class="lampiran-desc">
            Lampiran berikut ini memuat daftar bidang usaha untuk:
        </div>

        <!-- TABEL -->
        <div class="table-wrapper">
            <table id="kbliTable">
                <thead>
                    <tr>
                        <th rowspan="2" class="col-no">No</th>
                        <th rowspan="2" class="col-kbli">Kode KBLI</th>
                        <th rowspan="2" class="col-judul">Judul KBLI</th>
                        <th rowspan="2" class="col-lokasi">Lokasi Usaha</th>
                        <th rowspan="2" class="col-risiko">Tingkat Risiko</th>
                        <th colspan="3" class="group-header">Perizinan Berusaha</th>
                        <th rowspan="2" class="col-action" style="width:50px;">Aksi</th>
                    </tr>
                    <tr>
                        <th class="col-izin">Jenis</th>
                        <th class="col-status">Status</th>
                        <th class="col-keterangan">Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td class="col-no td-center"><input type="text" value="1" readonly></td>
                        <td class="col-kbli td-center"><input type="text" value="47241"></td>
                        <td class="col-judul"><textarea rows="1">Perdagangan Eceran Beras</textarea></td>
                        <td class="col-lokasi"><textarea rows="2">Blok III Rt 03 Rw 09, Desa/Kelurahan Kertasura, Kec. Kapetakan, Kab. Cirebon, Provinsi Jawa Barat Kode Pos: 45152</textarea></td>
                        <td class="col-risiko td-center"><input type="text" value="Rendah"></td>
                        <td class="col-izin td-center"><input type="text" value="NIB"></td>
                        <td class="col-status td-center"><input type="text" value="Terbit"></td>
                        <td class="col-keterangan td-center"><input type="text" value="-"></td>
                        <td class="col-action td-center">
                            <button class="btn-delete-row" onclick="deleteRow(this)" title="Hapus baris">✕</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- FOOTER NOTE -->
        <div class="footer-note">
            Dicetak pada: <span id="printDate"></span>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-bar">
        <button class="btn btn-add" onclick="addRow()">+ Tambah Kolom KBLI</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ Cetak / Print</button>
    </div>

    <script>
        // Update nomor urut setelah perubahan
        function renumberRows() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                const noInput = row.querySelector('.col-no input');
                if (noInput) {
                    noInput.value = index + 1;
                }
            });
        }

        // Tambah baris baru
        function addRow() {
            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="col-no td-center"><input type="text" value="" readonly></td>
                <td class="col-kbli td-center"><input type="text" value="" placeholder="Kode"></td>
                <td class="col-judul"><textarea rows="1" placeholder="Judul KBLI"></textarea></td>
                <td class="col-lokasi"><textarea rows="2" placeholder="Lokasi Usaha"></textarea></td>
                <td class="col-risiko td-center"><input type="text" value="" placeholder="Risiko"></td>
                <td class="col-izin td-center"><input type="text" value="" placeholder="Jenis"></td>
                <td class="col-status td-center"><input type="text" value="" placeholder="Status"></td>
                <td class="col-keterangan td-center"><input type="text" value="" placeholder="-"></td>
                <td class="col-action td-center">
                    <button class="btn-delete-row" onclick="deleteRow(this)" title="Hapus baris">✕</button>
                </td>
            `;

            tbody.appendChild(newRow);
            renumberRows();

            // Fokus ke input KBLI di baris baru
            const newInput = newRow.querySelector('.col-kbli input');
            if (newInput) newInput.focus();
        }

        // Hapus baris
        function deleteRow(button) {
            const row = button.closest('tr');
            const tbody = document.getElementById('tableBody');
            if (tbody.rows.length <= 1) {
                alert('Minimal harus ada satu baris data.');
                return;
            }
            if (confirm('Yakin ingin menghapus baris ini?')) {
                row.remove();
                renumberRows();
            }
        }

        // Isi tanggal cetak saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            document.getElementById('printDate').textContent = dateStr;
        });

        // Auto-resize textarea agar muat konten
        document.addEventListener('input', function(e) {
            if (e.target.tagName === 'TEXTAREA') {
                e.target.style.height = 'auto';
                e.target.style.height = e.target.scrollHeight + 'px';
            }
        });

        // Inisialisasi auto-resize untuk textarea yang sudah ada
        window.addEventListener('load', function() {
            document.querySelectorAll('textarea').forEach(function(ta) {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });
        });
    </script>

</body>
</html>
